name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - dev/windows-modernization
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"
  SOURCE_DATE_EPOCH: "1794700800"

jobs:
  windows-release:
    name: Test and build Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install --requirement requirements-build.txt
          python -m pip check

      - name: Run tests, build exe, ZIP, and installer
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          ./build.ps1 -Python $python -ToolRoot "$env:RUNNER_TEMP\inno-setup"

      - name: Verify packaged app and installer lifecycle
        shell: pwsh
        run: |
          python scripts/windows_smoke.py --exe dist/VencordAutoRepair/VencordAutoRepair.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/installer_smoke.py dist/VencordAutoRepairSetup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VencordAutoRepair-0.4.0-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/VencordAutoRepair/**
            dist/VencordAutoRepair-0.4.0-win64-portable.zip
            dist/VencordAutoRepairSetup.exe
            dist/SHA256SUMS.txt

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v

